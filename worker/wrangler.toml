name = "nomis-tts-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# REQUIRED: your GitHub Pages ORIGIN (scheme + host only, no path). Comma-separate several.
ALLOWED_ORIGINS = "https://YOUR-GITHUB-USERNAME.github.io"
DEFAULT_VOICE = "en-US-EricNeural"
# MAX_TEXT_CHARS = "5000"
